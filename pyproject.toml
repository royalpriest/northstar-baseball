[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-baseball"
version = "0.1.0"
description = "Context-aware baseball run-creation analytics with a Canadian focus."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Royalpriest Babalola" }]
dependencies = [
  "duckdb>=1.5,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "polars>=1.30,<2",
  "pyarrow>=18,<22",
  "pybaseball>=2.2,<3",\n  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "shap>=0.46,<1",
  "statsmodels>=0.14,<1",
  "xgboost>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
